<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freebuff Dashboard</title>
<link rel="stylesheet" href="/app.css">
<script>
  var chosen = "system";
  try {
    chosen = localStorage.getItem("freebuff-search.theme") || "system";
  } catch { }
  if (chosen !== "light" && chosen !== "dark") {
    chosen = window.matchMedia("(prefers-color-scheme: dark)").matches
      ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", chosen);
</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="side-head">
      <button class="side-title" id="side-title" type="button"
              title="Every project — back to the landing page">Projects</button>
      <span class="side-tools">
        <button class="side-new side-arch" id="archived" type="button"
                aria-pressed="false" title="Archived threads"
                aria-label="Show archived threads">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor"
                    stroke-width="1.7"/>
            <line x1="8" y1="8" x2="8" y2="4.6" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round"/>
            <line x1="8" y1="8" x2="10.9" y2="9.4" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span class="arch-count" id="arch-count"></span>
        </button>
        <button class="side-new" id="search-open" type="button"
                title="New search — every project" aria-label="New search">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <circle cx="6.6" cy="6.6" r="4.6" fill="none" stroke="currentColor"
                    stroke-width="1.7"/>
            <line x1="10.1" y1="10.1" x2="14.4" y2="14.4" stroke="currentColor"
                  stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
        <a class="side-new" id="activity-open" href="/activity"
           title="Running threads — the activity page"
           aria-label="Running threads">
          <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <rect x="1.1" y="1.1" width="13.8" height="13.8" rx="4.2"
                  fill="none" stroke="currentColor" stroke-width="1.7"/>
            <path d="M3.3 8.6h2.1l1.4-3.9 2.1 6.6 1.4-2.7h2.4" fill="none"
                  stroke="currentColor" stroke-width="1.7" stroke-linecap="round"
                  stroke-linejoin="round"/>
          </svg>
        </a>
      </span>
    </div>
    <div class="tree" id="tree"></div>
  </aside>

  <main class="main">
    <form class="bar" id="bar" autocomplete="off">
      <div class="bar-row">
        <input class="bar-q" id="q" type="search" placeholder="Search every conversation…"
               aria-label="Search">
        <select class="bar-scope" id="scope" aria-label="Scope">
          <option value="all">all projects</option>
          <option value="project">this project</option>
          <option value="thread">this thread</option>
        </select>
        <select class="bar-mode" id="mode" aria-label="Mode">
          <option value="words">Words / Phrase</option>
          <option value="exact">Exact text</option>
        </select>
        <span class="gear-wrap">
          <button class="gear" id="gear" type="button" aria-haspopup="true"
                  aria-expanded="false" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M10.14 3.6L10.54 0.9A11.2 11.2 0 0 1 13.46 0.9L13.86 3.6A8.6 8.6 0 0 1 16.62 4.75L18.82 3.11A11.2 11.2 0 0 1 20.89 5.18L19.25 7.38A8.6 8.6 0 0 1 20.4 10.14L23.1 10.54A11.2 11.2 0 0 1 23.1 13.46L20.4 13.86A8.6 8.6 0 0 1 19.25 16.62L20.89 18.82A11.2 11.2 0 0 1 18.82 20.89L16.62 19.25A8.6 8.6 0 0 1 13.86 20.4L13.46 23.1A11.2 11.2 0 0 1 10.54 23.1L10.14 20.4A8.6 8.6 0 0 1 7.38 19.25L5.18 20.89A11.2 11.2 0 0 1 3.11 18.82L4.75 16.62A8.6 8.6 0 0 1 3.6 13.86L0.9 13.46A11.2 11.2 0 0 1 0.9 10.54L3.6 10.14A8.6 8.6 0 0 1 4.75 7.38L3.11 5.18A11.2 11.2 0 0 1 5.18 3.11L7.38 4.75A8.6 8.6 0 0 1 10.14 3.6Z"
                    fill="none" stroke="currentColor" stroke-width="1.5"
                    stroke-linejoin="round"/>
              <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor"
                      stroke-width="1.5"/>
            </svg>
          </button>
          <div class="menu" id="menu" hidden>
            <div class="menu-title">Theme</div>
            <button class="menu-item" id="theme-light" type="button">
              <span class="tick">✓</span>Light</button>
            <button class="menu-item" id="theme-dark" type="button">
              <span class="tick">✓</span>Dark</button>
            <button class="menu-item" id="theme-system" type="button">
              <span class="tick">✓</span>System</button>
            <div class="menu-title">Debug</div>
            <label class="menu-item" id="debug-item"><input type="checkbox" id="debug">
              Show debug info</label>
          </div>
        </span>
      </div>

      <div class="filters" id="filters">
        <div class="fgroup">
          <span class="flabel">Categories</span>
          <div class="fopts">
            <label class="fopt"><input type="checkbox" id="cat-user" checked> User messages</label>
            <label class="fopt"><input type="checkbox" id="cat-assistant" checked> Agent responses</label>
            <label class="fopt"><input type="checkbox" id="cat-reasoning"> Thinking</label>
            <label class="fopt"><input type="checkbox" id="cat-tools"> Tool runs</label>
            <label class="fopt"><input type="checkbox" id="cat-changes"> File diffs</label>
          </div>
        </div>
        <div class="fgroup">
          <span class="flabel">Dates</span>
          <div class="fopts">
            <label class="fopt">from <input type="date" id="since" aria-label="From date"></label>
            <label class="fopt">to <input type="date" id="until" aria-label="To date"></label>
            <label class="fopt"><input type="checkbox" id="hide-closed"> Hide closed threads</label>
            <button class="fnote" id="clear-all" type="button">clear all</button>
          </div>
        </div>
      </div>
    </form>

    <div class="hits" id="hits"></div>
    <div class="matchbar" id="matchbar" hidden>
      <span class="matchcount" id="matchcount"></span>
      <span class="matchpos" id="matchpos"></span>
      <button class="matchstep" id="match-prev" type="button"
              title="Previous match" aria-label="Previous match">&#8249;</button>
      <button class="matchstep" id="match-next" type="button"
              title="Next match" aria-label="Next match">&#8250;</button>
    </div>
    <div class="pane" id="pane"></div>
  </main>
</div>

<footer class="foot" id="foot"></footer>
<script src="/app.js"></script>
</body>
</html>
